# Xcode projesi bu dosyadan XcodeGen ile uretilir (GitHub Actions'ta otomatik).
name: ElnurTTS
options:
  bundleIdPrefix: az.elnurtts
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: az

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "6.15.5"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO

packages:
  ElnurTTSEngine:
    path: Packages/ElnurTTSEngine

targets:
  # Ortak katman: ElnurTTS motoru + ses/dil verileri. Uygulama ve eklenti paylasir.
  ElnurKit:
    type: framework
    platform: iOS
    sources:
      - path: ElnurKit/Sources
      - path: ElnurKit/Resources/ElnurData
        type: folder
        buildPhase: resources
      - path: ElnurKit/Resources/ElnurConfig
        type: folder
        buildPhase: resources
      - path: ElnurKit/Resources/ElnurVoices.json
        buildPhase: resources
      - path: ElnurKit/Resources/Emoji
        type: folder
        buildPhase: resources
    dependencies:
      - package: ElnurTTSEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: az.elnurtts.kit
        GENERATE_INFOPLIST_FILE: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        INSTALL_PATH: "@rpath"
        DYLIB_INSTALL_NAME_BASE: "@rpath"

  # VoiceOver'in kullandigi ses eklentisi (Speech Synthesis Provider Audio Unit).
  ElnurExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ElnurExtension
        excludes: [Info.plist]
    dependencies:
      - target: ElnurKit
        embed: false
      - sdk: AVFAudio.framework
      - sdk: CoreAudioKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: az.elnurtts.app.synthesizer
        INFOPLIST_FILE: ElnurExtension/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ElnurTTS Synthesizer
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
        SKIP_INSTALL: YES

  # Ana uygulama: sesleri sisteme tanitir, deneme ekrani sunar.
  ElnurTTS:
    type: application
    platform: iOS
    sources:
      - path: ElnurApp
    dependencies:
      - target: ElnurKit
      - target: ElnurExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: az.elnurtts.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ElnurTTS
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"

  ElnurTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ElnurTests
    dependencies:
      - target: ElnurTTS
      - target: ElnurKit
        embed: false
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: az.elnurtts.tests

schemes:
  ElnurTTS:
    build:
      targets:
        ElnurTTS: all
        ElnurTests: [test]
    test:
      config: Debug
      targets:
        - ElnurTests
